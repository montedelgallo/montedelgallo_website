name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build site (EN + IT)
    runs-on: ubuntu-latest
    env:
      JEKYLL_ENV: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Ruby and install gems
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # jekyll-polyglot requires Ruby >= 3.2
          bundler-cache: true # runs `bundle install` and caches the gems

      - name: Build site
        run: bundle exec jekyll build

      - name: Check bilingual build output
        run: bash script/check-build.sh

      # The built site (.check-site, from the step above) is served by script/serve-built-site.py with
      # its own /_headers (Content-Security-Policy included), then audited on the home, a project, an
      # article and the contact page: performance, accessibility and SEO >= 95, best practices >= 90.
      # Chrome is preinstalled on ubuntu-latest.
      - name: Lighthouse CI (mobile)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.json

      - name: Lighthouse CI (desktop)
        run: npx --yes @lhci/cli@0.15.1 autorun --config=.lighthouserc.desktop.json
