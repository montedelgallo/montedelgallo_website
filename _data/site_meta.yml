# Site-wide SEO defaults and company facts. Read in templates as
# site.data.site_meta.<key>; the per-language blocks (en, it) as
# site.data.site_meta[site.active_lang].<key>.
#
# A page overrides the defaults in its own front matter:
#   title        the page's name; the <title> becomes "<title> | Monte del Gallo"
#   meta_title   the complete <title>, for when it has to differ from the name
#   description  meta description, also used for Open Graph and Twitter
#   image        share-image path for this page, e.g. /assets/img/share/home.png
#                (a page with a `cover` shares its cover; any other page shares the
#                default card of its language, <lang>.share_image below; share images
#                are JPG or PNG of 1200x630, never webp: the cover JPGs are made by
#                script/make-share-images.rb into assets/img/share/cover/)

en:
  title: "Monte del Gallo | Custom software, automation & AI in Rome"
  description: "Monte del Gallo is a software boutique in Rome. We build custom software, automate the work you repeat and put AI where it pays off. Book a 30-minute call."
  locale: "en_US" # Open Graph locale
  tagline: "Custom software, automation and AI. Built in Rome." # printed on the share card
  share_image: "/assets/img/share/default-en.png"
  share_alt: "Monte del Gallo: custom software, automation and AI. Built in Rome. The mountain mark on a blueprint grid above a green mountain range." # alt text of the card
it:
  title: "Monte del Gallo | Software su misura, AI, automazione a Roma"
  description: "Monte del Gallo è una boutique del software a Roma: software su misura, automazione dei processi e AI dove rende davvero. Prenota una call di 30 minuti."
  locale: "it_IT"
  tagline: "Software su misura, automazione e AI. Realizzati a Roma."
  share_image: "/assets/img/share/default-it.png"
  share_alt: "Monte del Gallo: software su misura, automazione e AI. Realizzati a Roma. Il marchio a montagna su una griglia tecnica sopra una catena di montagne verdi."

# Booking page: the primary call to action on every page.
booking_url: "https://soshiki.io/book/mdg/short-call-with-giovanni"

# Cookieless, consent-banner-free analytics (_includes/analytics.html, assets/js/events.js).
#   provider    plausible | umami | "" (empty: no analytics script, no events script, nothing renders)
#   domain      plausible: the site's domain as added in Plausible (data-domain)
#   website_id  umami: the website id
#   src         optional: the provider's script URL. Plausible defaults to
#               https://plausible.io/js/script.js (the data-domain embed). Plausible's newer
#               per-site embed (https://plausible.io/js/pa-<id>.js, shown in the site's settings under
#               Site installation) can be pasted here instead; it needs no data-domain and is
#               still one deferred, external script. Umami defaults to https://cloud.umami.is/script.js
#               (a self-hosted Umami: its own script URL here, and add its host to the CSP).
# Events (book_call_click, contact_submit, phone_click, email_click, whatsapp_click, download_click) are
# declared in the markup with data-track / data-track-location and sent by events.js.
analytics:
  provider: plausible
  domain: montedelgallo.com
  website_id: ""
  src: ""

# MotioForge downloads.
#   motioforge_download_url  the "Download Beta" button of both MotioForge pages. The archive (about
#                            214 MB) is served by Soshiki and managed by the client there; it is not
#                            in this repository and no size or checksum is shown for it. The old
#                            WordPress address of the archive redirects here (_data/redirects.yml).
#   downloads                the two overview PDFs, self-hosted in assets/downloads/<file> (about 2.9 MB
#                            each) and linked from both pages with their size. `bytes` must equal the
#                            file (stat -f%z); script/checks/downloads.rb compares them. To replace a
#                            PDF: overwrite the file under assets/downloads/ and update its bytes.
motioforge_download_url: "https://soshiki.io/cf/p3F7GT5iZGBEo8Fh8met6D2f/download"
downloads:
  - file: "MotioForge_Studio_overview_it.pdf"
    bytes: 2912514
  - file: "MotioForge_Studio_overview_en.pdf"
    bytes: 2913060

