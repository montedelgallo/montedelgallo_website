# Where the header navigation and the footer link columns point. The LABELS are
# not here: they come from _data/i18n/<lang>.yml (nav.<key> for `main`,
# footer.links.<key> for `footer_company`, footer.service_links.<key> for
# `footer_services`).
#
# Every entry has one path per language. Write the path WITHOUT the /it/ prefix:
# jekyll-polyglot adds it to internal links in the Italian build, so an Italian
# slug that differs from the English one (/services/ and /servizi/) is written
# as it is.
#
# `main` entries also carry `also:`, the other pages of the same section (per language, again without
# /it/): a page whose URL starts with the entry's path or with one of these paths is "in" that section,
# and the header marks the entry aria-current="page" (_includes/header.html). The home, the 404 and
# the legal pages belong to no section.
#
# Every entry leads to a page of its own: no link here may be a home anchor (/#...)
# or the bare home, script/check-build.sh fails on both. When a page moves, change
# its two paths here; no template changes.

main:
  - key: services
    en: "/services/"
    it: "/servizi/"
  - key: work
    en: "/projects/"
    it: "/progetti/"
    also:
      en: ["/case-studies/", "/motioforge/"]
      it: ["/casi-di-studio/", "/motioforge/"]
  - key: about
    en: "/about/"
    it: "/chi-siamo/"
    also:
      en: ["/careers/", "/startup-studio/", "/product-lab/"]
      it: ["/lavora-con-noi/", "/studio-startup/", "/laboratorio-prodotto/"]
  - key: blog
    en: "/blog/"
    it: "/articoli/"
  - key: contact
    en: "/contact/"
    it: "/contatti/"

footer_company:
  - key: services
    en: "/services/"
    it: "/servizi/"
  - key: case_studies
    en: "/case-studies/"
    it: "/casi-di-studio/"
  - key: about
    en: "/about/"
    it: "/chi-siamo/"
  - key: blog
    en: "/blog/"
    it: "/articoli/"
  - key: startup_studio
    en: "/startup-studio/"
    it: "/studio-startup/"
  - key: product_lab
    en: "/product-lab/"
    it: "/laboratorio-prodotto/"
  - key: careers
    en: "/careers/"
    it: "/lavora-con-noi/"
  - key: motioforge
    en: "/motioforge/"
    it: "/motioforge/"

footer_services:
  - key: software
    en: "/services/custom-software/"
    it: "/servizi/software-su-misura/"
  - key: ai_automation
    en: "/services/ai-automation/"
    it: "/servizi/ai-e-automazione/"
  - key: data_systems
    en: "/services/data-systems/"
    it: "/servizi/sistemi-di-dati/"
  - key: websites
    en: "/services/websites/"
    it: "/servizi/siti-web/"
  - key: mobile
    en: "/services/mobile-apps/"
    it: "/servizi/app-mobile/"
