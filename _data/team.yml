# The people shown in the team grid of the home and of the About hub
# (_includes/team-grid.html), in two rows:
#
#   founders   the first row: the founders, with their badge. Shown on three columns.
#   members    the second row: the team. Shown on four columns, so a fourth person added
#              to this list (a single entry) takes the fourth place of the row.
#
# Each row follows the order of its list. Every name, role and badge is what the live
# montedelgallo.com About page prints (first names only where the live page gives no
# surname), except Edoardo Cirone, whom the client supplied on 2026-10-17 together
# with his portrait.
#
#   name      what the grid prints (also the start of the portrait's alt text)
#   badge     optional small label above the name, per language (the founders)
#   role      per language; both are required (script/check-build.sh)
#   photo     public path of the portrait under /assets/team/, a square image, with its
#             pixel size in photo_w and photo_h (so the page does not jump when it
#             loads). A member WITHOUT `photo` gets a Foundry tile with their initials.
#             A portrait that no member names does not belong in assets/team/ (the build
#             check fails on it): remove the file with the person.
#
# `portrait` is the start of the portrait's alt text ("Portrait of Giovanni Panasiti").
# `groups` names each row for assistive technology (aria-label), per language.

portrait:
  en: "Portrait of"
  it: "Ritratto di"

groups:
  founders: { en: "Founders", it: "Fondatori" }
  members: { en: "Team", it: "Team" }

founders:
  - name: "Francesco"
    badge: { en: "Founder", it: "Founder" }
    role: { en: "Administration & Finance", it: "Amministrazione e Finanza" }
    photo: /assets/team/francesco.webp
    photo_w: 800
    photo_h: 800
  - name: "Giovanni Panasiti"
    badge: { en: "Co-Founder", it: "Co-Founder" }
    role: { en: "Software Engineer", it: "Software Engineer" }
    photo: /assets/team/giovanni.webp
    photo_w: 800
    photo_h: 800
  - name: "Niccolò"
    badge: { en: "Co-Founder", it: "Co-Founder" }
    role: { en: "Business Development", it: "Business Development" }
    photo: /assets/team/niccolo.webp
    photo_w: 800
    photo_h: 800

members:
  - name: "Carlo"
    role: { en: "Senior Web Designer", it: "Senior Web Designer" }
    photo: /assets/team/carlo.webp
    photo_w: 800
    photo_h: 800
  - name: "Claudio Aiello"
    role: { en: "Junior Software Engineer", it: "Junior Software Engineer" }
    photo: /assets/team/claudio.webp
    photo_w: 260
    photo_h: 260
  - name: "Giuseppe"
    role: { en: "WordPress Developer & DJ", it: "WordPress Developer & DJ" }
    photo: /assets/team/giuseppe.webp
    photo_w: 260
    photo_h: 260
  - name: "Edoardo Cirone"
    role: { en: "Developer", it: "Developer" }
    photo: /assets/team/edoardo.webp
    photo_w: 800
    photo_h: 800
