# The old WordPress URL -> the URL on this site, for every page whose address
# changed in the migration. This file is DATA only: nothing reads it at build time
# yet. Emitting the real 301 redirects is Plan 3 (they depend on the host). Pages that
# kept their old URL are not listed. script/check-build.sh checks that the file parses,
# that every `to` is a page of the build and that no `from` is a built page.
#
# Paths are public URL paths, with the /it/ prefix for the Italian site.

# Case studies. The English ones lived at the site root (/case-study-<name>/); they
# now sit under /case-studies/ like the one that already did. The two Italian case
# studies and the restaurant one kept their address:
#   /case-studies/restaurant-management-software-case-study/
#   /it/casi-di-studio/case-study-su-un-software-di-gestione-per-ristoranti/
#   /it/casi-di-studio/caso-studio-property-management-turismo-roma/
# The Italian e-commerce page is new (the old site had it in English only), so it has
# no old URL to redirect.
- from: /case-study-ecommerce-platform/
  to: /case-studies/ecommerce-platform/
- from: /case-study-property-management-tourism-rome/
  to: /case-studies/property-management-tourism-rome/

# Services. The overview pages kept their address (/services/, /it/servizi/). The live
# pages below were folded into service pages: the data and mobile pages into the
# service of the same subject, the technologies pages (a list of tools) into Custom
# software, which now carries the stack. The Italian addresses sat at the root of the
# Italian site and now sit under /it/servizi/.
- from: /data-analysis/
  to: /services/data-systems/
- from: /mobile-development/
  to: /services/mobile-apps/
- from: /technologies/
  to: /services/custom-software/
- from: /it/analisi-dati-ai/
  to: /it/servizi/sistemi-di-dati/
- from: /it/sviluppo-mobile/
  to: /it/servizi/app-mobile/
- from: /it/tecnologie/
  to: /it/servizi/software-su-misura/

# Blog. Every article lived at the root of the old site (/<slug>/). The eight English ones
# now sit under /blog/; the Italian one (an article written in Italian that the old site
# served at an English root URL) sits under /it/articoli/. The old category and author
# archives are not kept: this version has no category pages.
