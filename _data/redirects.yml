# MotioForge downloads. The three files lived in the uploads folder of the old WordPress, which
# this site replaces. The archive is now served by Soshiki (site_meta.yml motioforge_download_url,
# managed by the client) and the two overview PDFs are in the repository (assets/downloads/).
# External pages, mails and search results still link the old addresses, so each is a 301 to the
# new one. These are the only entries whose `from` is a file path; script/checks/redirects.rb allows
# exactly that: a file under /wp-content/uploads/ to motioforge_download_url or to a listed PDF of
# /assets/downloads/, nothing broader.
- from: /wp-content/uploads/motioforge/MotioForge_Studio.zip
  to: https://soshiki.io/cf/p3F7GT5iZGBEo8Fh8met6D2f/download
- from: /wp-content/uploads/2026/09/MotioForge_Studio_overview_it.pdf
  to: /assets/downloads/MotioForge_Studio_overview_it.pdf
- from: /wp-content/uploads/2026/09/MotioForge_Studio_overview_en.pdf
  to: /assets/downloads/MotioForge_Studio_overview_en.pdf
