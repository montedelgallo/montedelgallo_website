# The old WordPress URL -> the URL on this site, for every page whose address
# changed in the migration. This file is DATA only: nothing reads it at build time
# yet. Emitting the real 301 redirects is Plan 3 (they depend on the host). Pages that
# kept their old URL are not listed. script/check-build.sh checks that the file parses,
# that every `to` is a page of the build and that no `from` is a built page.
#
# Paths are public URL paths, with the /it/ prefix for the Italian site.

# Case studies. The English ones lived at the site root (/case-study-<name>/); they
# now sit under /case-studies/ like the one that already did. The two Italian case
# studies and the restaurant one kept their address:
#   /case-studies/restaurant-management-software-case-study/
#   /it/casi-di-studio/case-study-su-un-software-di-gestione-per-ristoranti/
#   /it/casi-di-studio/caso-studio-property-management-turismo-roma/
# The Italian e-commerce page is new (the old site had it in English only), so it has
# no old URL to redirect.
- from: /case-study-ecommerce-platform/
  to: /case-studies/ecommerce-platform/
- from: /case-study-property-management-tourism-rome/
  to: /case-studies/property-management-tourism-rome/

# Services. The overview pages kept their address (/services/, /it/servizi/). The live
# pages below were folded into service pages: the data and mobile pages into the
# service of the same subject, the technologies pages (a list of tools) into Custom
# software, which now carries the stack. The Italian addresses sat at the root of the
# Italian site and now sit under /it/servizi/.
- from: /data-analysis/
  to: /services/data-systems/
- from: /mobile-development/
  to: /services/mobile-apps/
- from: /technologies/
  to: /services/custom-software/
- from: /it/analisi-dati-ai/
  to: /it/servizi/sistemi-di-dati/
- from: /it/sviluppo-mobile/
  to: /it/servizi/app-mobile/
- from: /it/tecnologie/
  to: /it/servizi/software-su-misura/

# Blog. Every article lived at the root of the old site (/<slug>/). The eight English ones
# now sit under /blog/; the Italian one (an article written in Italian that the old site
# served at an English root URL) sits under /it/articoli/. The old category archives
# (/category/<name>/) are not kept, the blog index lists every article: they go there.
- from: /welcome-claudio-aiello/
  to: /blog/welcome-claudio-aiello/
- from: /how-i-started-creating-a-product-a-month-just-for-fun/
  to: /blog/how-i-started-creating-a-product-a-month-just-for-fun/
- from: /software-development-done-right-the-mdg-way/
  to: /blog/software-development-done-right-the-mdg-way/
- from: /welcome-mouaz-el-molkey/
  to: /blog/welcome-mouaz-el-molkey/
- from: /welcome-marco-cherubini/
  to: /blog/welcome-marco-cherubini/
- from: /meet-consultala-the-legal-tech-start-up-erasing-labor-law-bureaucracy/
  to: /blog/meet-consultala-the-legal-tech-start-up-erasing-labor-law-bureaucracy/
- from: /design-minimalista-la-semplicita-come-chiave-per-il-successo-digitale-nel-2025/
  to: /it/articoli/design-minimalista-la-semplicita-come-chiave-per-il-successo-digitale-nel-2025/
- from: /saladil-revolutionizing-wordpress-support-one-ticket-at-a-time/
  to: /blog/saladil-revolutionizing-wordpress-support-one-ticket-at-a-time/
- from: /get-ready-for-your-next-react-job-interview/
  to: /blog/get-ready-for-your-next-react-job-interview/

# About hub. The live our-story, manifesto and our-process pages (and the Italian storia,
# manifesto-monte-del-gallo and metodo pages) are now sections of the About hub, with stable
# ids: #story, #manifesto, #process (#team is the team grid). The old /about/ and
# /it/chi-siamo/ kept their address. The Startup Studio, Product Lab and Careers pages
# kept theirs too (/startup-studio/, /product-lab/, /careers/ and /it/studio-startup/,
# /it/laboratorio-prodotto/, /it/lavora-con-noi/).
- from: /our-story/
  to: /about/#story
- from: /manifesto/
  to: /about/#manifesto
- from: /our-process/
  to: /about/#process
- from: /it/storia/
  to: /it/chi-siamo/#story
- from: /it/manifesto-monte-del-gallo/
  to: /it/chi-siamo/#manifesto
- from: /it/metodo/
  to: /it/chi-siamo/#process

# MotioForge. The English page kept its address (/motioforge/). The Italian page lived at
# /it/motioforge-2/ (a WordPress "-2" duplicate slug) and now sits at /it/motioforge/.
- from: /it/motioforge-2/
  to: /it/motioforge/

# Portfolio. The old /portfolio/ page was the project list; it is /projects/ now.
- from: /portfolio/
  to: /projects/

# Category archives. This version has no category pages; the blog index lists every
# article (with its categories), so the five old archives lead there.
- from: /category/frontend/
  to: /blog/
- from: /category/products/
  to: /blog/
- from: /category/story/
  to: /blog/
- from: /category/team/
  to: /blog/
- from: /category/web-design/
  to: /blog/

# Feed. WordPress served the feed at /feed/; it is /feed.xml here.
- from: /feed/
  to: /feed.xml
