# UI strings, English. Read in templates as site.data.i18n[site.active_lang].<key>.
#
# Italian lives in it.yml and must define exactly the same keys (script/check-build.sh
# compares the two files), so a missing translation fails the build instead of
# showing up as a blank on the Italian page. Quote a value that contains `: ` or
# starts with a symbol; `&` and `<` are escaped by the templates, so write them
# as plain text.
#
# The `home:` tree holds the words of the home page, section by section in page
# order (hero, services, growth system, work, Robotic Lab, who we are, team,
# process, final call to action). Read in _includes/home/<section>.html as
# t.home.<section>.<key>. A list (stats, services, ...) is a YAML list of maps and
# the page shows its items in that order. An `icon` names a symbol of
# _includes/icons.html and is the same in both languages (the check compares it).

lang:
  name: "English" # the language's own name, used by the language switch

a11y:
  skip: "Skip to content"
  main_nav: "Main"
  language: "Language"

util:
  location: "Roma, Italy"

