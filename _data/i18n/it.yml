    title: "Sistemi digitali progettati per operare meglio."
    lede: "Software, automazione e crescita misurabile, costruiti attorno a come lavora davvero la tua azienda."
    items:
      - icon: "i-code"
        title: "Software su misura"
        text: "Strumenti interni, prodotti SaaS, dashboard e piattaforme costruiti attorno ai flussi di lavoro reali."
      - icon: "i-ai"
        title: "AI e automazione"
        text: "Flussi con LLM, elaborazione di documenti, automazioni CRM e copilot per il back office."
      - icon: "i-data"
        title: "Sistemi di dati"
        text: "Analytics, reportistica e integrazioni che rendono le decisioni più chiare."
      - icon: "i-mobile"
        title: "App mobile"
        text: "App native e ibride per clienti, team e operatività sul campo."
      - icon: "i-web"
        title: "Siti web"
        text: "Siti e landing page ad alte prestazioni che convertono."
      - icon: "i-cart"
        title: "E-commerce"
        text: "Negozi online, ottimizzazione del checkout e automazione operativa."
      - icon: "i-signage"
        title: "Digital signage"
        text: "Schermi, playlist e infrastruttura per locali e reti multi-sede."
      - icon: "i-seo"
        title: "SEO e GEO"
        text: "Visibilità nei motori di ricerca e nelle risposte AI, costruita su contenuti strutturati ed entità."
  growth:
    eyebrow: "Growth system · un unico stack"
    title: "Design, codice e automazione in un unico flusso di lavoro."
    lede: "Tre livelli che lavorano insieme — così ciò che costruiamo continua a dare risultati anche dopo il lancio."
    items:
      - icon: "i-ai"
        title: "Agenti AI e RAG"
        text: "Automazione basata sui tuoi dati, documenti e processi."
        tag: "Costruisci"
      - icon: "i-ship"
        title: "Ruby on Rails"
        text: "Prodotti, dashboard e flussi di lavoro affidabili, rilasciati in tempi rapidi."
        tag: "Rilascia"
      - icon: "i-seo"
        title: "Web + growth"
        text: "Performance, contenuti e visibilità su motori di ricerca e risposte AI."
        tag: "Posizionati"
  work:
    eyebrow: "Progetti selezionati"
    title: "Sistemi in produzione, risultati misurabili."
  who:
    eyebrow: "Chi siamo"
    title: "Una boutique del software, non un'agenzia tradizionale."
    lede: "Uniamo creatività e ingegneria per costruire sistemi essenziali e affidabili. Processo snello, consegne puntuali, nessuna complessità inutile."
    art_label: "Il marchio Monte del Gallo su una griglia blueprint"
    badge: "Studio · Roma"
    items:
      - title: "Meno è meglio"
        text: "Ci concentriamo su ciò che crea valore misurabile: architettura pulita, interfacce veloci, prodotti facili da mantenere."
      - title: "Agili per natura"
        text: "Niente burocrazia inutile. Ci adattiamo in fretta quando i requisiti cambiano e teniamo sempre visibile l'avanzamento."
      - title: "I vincoli come leva"
        text: "Budget, tempi e sistemi legacy diventano vincoli di progetto che portano a soluzioni più mirate e più utili."
  process:
    eyebrow: "Come lavoriamo"
    title: "Da operazioni caotiche a un sistema che funziona da solo."
    items:
      - title: "Mappa"
        text: "Mappiamo i tuoi dati, i tuoi strumenti e i flussi di lavoro che il tuo team ripete ogni giorno."
      - title: "Costruisci"
        text: "Rilasciamo il software su misura e le integrazioni di cui il lavoro ha davvero bisogno."
      - title: "Automatizza"
        text: "Eliminiamo i passaggi manuali con automazione e AI dove conviene davvero."
      - title: "Misura"
        text: "Misuriamo i risultati reali e continuiamo a migliorare ciò che muove i numeri."
  cta:
    eyebrow: "Inizia da qui"
    title: "Costruiamo insieme qualcosa di utile."
    text: "In 30 minuti mappiamo dove la tua azienda può crescere tra software, automazione e AI — poi definiamo un percorso concreto verso risultati misurabili."
    book: "Prenota una call di 30 minuti"
    whatsapp: "Scrivici su WhatsApp"

