# Monte del Gallo - bilingual Jekyll site: English at the root, Italian under /it/.
# Built in CI (GitHub Actions); the output is plain static files, so it can be
# deployed to any host.

# --- Site identity -----------------------------------------------------------
title: "Monte del Gallo"
# jekyll-polyglot needs `url` to relativize links per language.
url: "https://montedelgallo.com"
baseurl: ""

# --- Internationalization (jekyll-polyglot) ----------------------------------
languages: ["en", "it"]
default_lang: "en"
# Build the default language first, in the parent process, and fork only the
# others. Otherwise the EN and IT forks both wipe and rewrite .jekyll-cache at
# the same time, and about 1 build in 40 crashes with Errno::ENOENT.
serial_default_lang: true
# Emitted once at the site root; not duplicated under /it/, and links to them
# are not language-prefixed. `redirects` is the source of /_redirects (the 301 map for
# Cloudflare Pages / Netlify): written once at the root, not under /it/.
exclude_from_localization: ["assets", "redirects"]

# --- Content -----------------------------------------------------------------
permalink: pretty
markdown: kramdown
kramdown:
  input: GFM

# Projects: one document per language per project, in _projects/ (the Italian
# ones in _projects/it/), tied together by a shared `page_id`. Each document
# sets its own `permalink`, because the slugs differ by language (/projects/<slug>/
# in English, /progetti/<slug>/ in Italian). Permalinks never carry the /it/
# prefix: jekyll-polyglot adds it itself.
collections:
  projects:
    output: true
  # Case studies: the same arrangement as the projects. One document per language
  # per case study in _case_studies/ (the Italian ones in _case_studies/it/), tied by
  # a shared `page_id`, each with a bare `permalink`: /case-studies/<slug>/ in
  # English, /casi-di-studio/<slug>/ in Italian (polyglot adds /it/).
  case_studies:
    output: true
  # Services: the eight services of the home page, one document per language per
  # service in _services/ (the Italian ones in _services/it/), tied by a shared
  # `page_id`, each with a bare `permalink`: /services/<slug>/ in English,
  # /servizi/<slug>/ in Italian (polyglot adds /it/). The overview pages are
  # services.html and it/servizi.html.
  services:
    output: true

# Blog: the articles are the built-in `posts` collection, in _posts/ (YYYY-MM-DD-<slug>.md).
# One document per article, in ONE language: an English article sets `lang: en` and
# `lang-exclusive: [en]`, so nothing is built under /it/ for it; an Italian one sets
# `lang: it`, `lang-exclusive: [it]` and is built under /it/ only. Each sets its own bare
# `permalink`: /blog/<slug>/ in English, /articoli/<slug>/ in Italian (polyglot adds /it/).
# The index pages are blog.html and it/articoli.html, and the Atom feed is feed.xml (one per
# language, written here instead of by jekyll-feed, see the comment in feed.xml).

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: case_studies
    values:
      layout: case_study
  - scope:
      path: ""
      type: services
    values:
      layout: service
  - scope:
      path: ""
      type: posts
    values:
      layout: post

# --- Styles ------------------------------------------------------------------
sass:
  style: compressed
  # No source maps: jekyll-polyglot makes Jekyll 4 generate them improperly
  # (see its README), and without them the output is identical in every
  # environment (no .map file, no sourceMappingURL comment).
  sourcemap: never

# --- Plugins -----------------------------------------------------------------
plugins:
  - jekyll-polyglot
  - jekyll-sitemap
  - jekyll-feed

# --- Repo files that must not be published -----------------------------------
# (Gemfile, Gemfile.lock, node_modules, vendor/bundle and dot-directories such
# as .github are already excluded by Jekyll's defaults.)
# The build check's output and cache folders (script/check-build.sh) are not part of the
# site, and a running `jekyll serve` must not regenerate when the check writes there.
exclude:
  - .check-site/
  - .check-cache/
  - README.md
  - script/
  - tasks/
  - design/
