# The 404 pages for the nginx fallback (Cloudflare Pages needs nothing: it serves the
# nearest 404.html up the directory tree, so /it/... gets /it/404.html on its own).
# Include inside the server block of montedelgallo.com, next to redirects.conf.
# Written by hand (not generated); script/checks/share_404.rb asserts both mappings are here.
#
# A missing URL under /it/ answers 404 with the Italian page, any other with the English one.
# The error_page target is picked per request (variables are allowed in its URI), and the two
# pages cannot be requested directly as content: `internal` leaves them to error_page.
set $mdg_404 /404.html;
if ($uri ~ ^/it(/|$)) {
  set $mdg_404 /it/404.html;
}
error_page 404 $mdg_404;
location = /404.html { internal; }
location = /it/404.html { internal; }
