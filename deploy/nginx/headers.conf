# The security and cache headers for the nginx fallback: the same policy as /_headers, which
# Cloudflare Pages reads (written from the `headers` page of the site). Include inside the server
# block of montedelgallo.com, next to redirects.conf and error-pages.conf.
# Written by hand (not generated); script/checks/csp.rb asserts that every header and the
# Content-Security-Policy are exactly those of the built /_headers, and that the script hash in the
# policy is the SHA-256 of the one inline script of the site (_includes/head.html).
#
# No add_header may appear in a location block of the server: nginx then stops inheriting the
# ones declared here. The cache lifetime is therefore picked with `set`/`if` (as error-pages.conf
# does) and sent by the one add_header below. An empty value sends no header at all.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-8lPAhsHw2YfhKzTADvM7cKkWnN0x+tW7bLY5CgC4aaY=' https://plausible.io; connect-src 'self' https://plausible.io; img-src 'self' data:; style-src 'self'; font-src 'self'; form-action 'self' https://soshiki.io; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;

# Fonts never change under their name; the other assets are not fingerprinted.
set $mdg_cache "";
if ($uri ~ ^/assets/fonts/) {
  set $mdg_cache "public, max-age=31536000, immutable";
}
if ($uri ~ ^/assets/(css|js)/) {
  set $mdg_cache "public, max-age=3600";
}
if ($uri ~ ^/assets/(img|team|downloads)/) {
  set $mdg_cache "public, max-age=86400";
}
add_header Cache-Control $mdg_cache;
